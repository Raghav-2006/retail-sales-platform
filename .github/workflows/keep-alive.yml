# Keep the Streamlit Community Cloud demo awake. Free Streamlit apps go to sleep after a period
# without visitors, and a sleeping app shows a "wake up" page instead of the dashboard. This job
# opens the app in a headless browser every 6 hours, clicks the wake-up button if the app is
# asleep, and waits for it to boot. Playwright is installed here only, not in requirements.txt.
name: Keep demo awake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://retail-sales-platform.streamlit.app
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Visit the app (and wake it if it is asleep)
        shell: python
        run: |
          import os

          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, timeout=90_000, wait_until="domcontentloaded")
              # The wake-up button only exists when the app is asleep; its absence is the normal case.
              wake = page.get_by_role("button", name="Yes, get this app back up!")
              try:
                  wake.wait_for(state="visible", timeout=15_000)
              except Exception:
                  print("App was already awake (no wake-up button).")
              else:
                  wake.click()
                  print("App was asleep: clicked 'Yes, get this app back up!'.")
              page.wait_for_timeout(30_000)   # let the app finish booting
              browser.close()
          print(f"Visited {url}")
